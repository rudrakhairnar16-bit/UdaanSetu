# Production Docker Compose — AWS/Cloud deployment
# Usage: docker compose -f docker-compose.prod.yml up -d
#
# Prerequisites:
#   1. Set a real SECRET_KEY in .env (openssl rand -hex 32)
#   2. Set strong POSTGRES_PASSWORD
#   3. Set CORS_ORIGINS to your production domain
#   4. Have a reverse proxy (nginx/Caddy) handling TLS termination

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-udaansetu}
      POSTGRES_USER: ${POSTGRES_USER:-udaansetu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # NO port mapping — internal only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"

  backend:
    build: ./backend
    env_file: .env
    # NO port mapping — accessed via reverse proxy
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
    restart: always
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    # NO port mapping — accessed via reverse proxy
    depends_on:
      - backend
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

volumes:
  postgres_data:
  uploads_data:
