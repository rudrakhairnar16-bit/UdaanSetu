version: '3.8'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: udaansetu
      POSTGRES_USER: udaansetu
      POSTGRES_PASSWORD: udaansetu
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U udaansetu -d udaansetu"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./v2/backend
      dockerfile: Dockerfile
    env_file: .env
    ports:
      - "8080:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./v2/backend/uploads:/app/uploads
    environment:
      - DATABASE_URL=postgresql://udaansetu:udaansetu@db:5432/udaansetu

  ml-service:
    build:
      context: ./v2/ml-service
      dockerfile: Dockerfile
    ports:
      - "8001:8000"
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql://udaansetu:udaansetu@db:5432/udaansetu

  frontend:
    build:
      context: ./v2/frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080
    ports:
      - "3001:3000"
    depends_on:
      - backend

volumes:
  postgres_data: