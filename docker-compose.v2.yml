version: '3.8'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: udaansetu
      POSTGRES_USER: udaansetu
      POSTGRES_PASSWORD: udaansetu
    volumes:
      - postgres_v2_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U udaansetu -d udaansetu"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./v2/backend
      dockerfile: Dockerfile
    ports:
      - "8081:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./v2/backend/uploads:/app/uploads
    environment:
      - DATABASE_URL=postgresql://udaansetu:udaansetu@db:5432/udaansetu
      - SECRET_KEY=dev-secret-key-change-in-production-2026
      - CORS_ORIGINS=["http://localhost:3002","http://localhost:3000"]

  ml-service:
    build:
      context: ./v2/ml-service
      dockerfile: Dockerfile
    ports:
      - "8002:8000"
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql://udaansetu:udaansetu@db:5432/udaansetu

  frontend:
    build:
      context: ./v2/frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8081
    ports:
      - "3002:3000"
    depends_on:
      - backend
    environment:
      - BACKEND_URL=http://backend:8000

volumes:
  postgres_v2_data:
