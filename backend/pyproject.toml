[project]
name = "udaansetu-backend"
version = "2.0.0"
description = "UdaanSetu FastAPI backend"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "sqlalchemy==2.0.36",
    "psycopg[binary]==3.2.3",
    "pydantic[email]==2.10.3",
    "pydantic-settings==2.7.0",
    "PyJWT==2.10.1",
    "pwdlib[argon2]==0.2.1",
    "python-multipart==0.0.20",
    "httpx==0.28.1",
    "pypdf==5.1.0",
    "python-docx==1.1.2",
    "alembic>=1.13.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers -x"
markers = [
    "slow: marks tests as slow",
    "security: marks security-focused tests",
]
