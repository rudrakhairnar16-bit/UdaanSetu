services:
  - type: web
    name: udaansetu-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: udaansetu-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: OLLAMA_ENABLED
        value: "false"
      - key: CORS_ORIGINS
        value: https://udaansetu.vercel.app
  - type: pgsql
    name: udaansetu-db
    plan: free
    databaseName: udaansetu
    user: udaansetu
